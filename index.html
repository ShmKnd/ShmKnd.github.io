<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Shoma Kondo portfolio — visual work, creative technology and product development." />
  <title>Shoma Kondo — Portfolio</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
</head>
<body>
  <main>
    <header class="site-header" id="home">
      <a class="identity" href="#home" aria-label="Shoma Kondo home">Shoma Kondo</a>
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="https://github.com/ShmKnd" target="_blank" rel="noopener">GitHub</a>
        <a href="https://plugin.soundrave.org/" target="_blank" rel="noopener">SoundRave</a>
      </nav>
    </header>

    <section class="work-section" id="work" aria-label="Portfolio work">
      <div class="filter-bar" role="toolbar" aria-label="Filter portfolio">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-chip" type="button" data-filter="visual" aria-pressed="false">Visual</button>
        <button class="filter-chip" type="button" data-filter="technology" aria-pressed="false">Technology</button>
        <button class="filter-chip" type="button" data-filter="product" aria-pressed="false">Product</button>
        <button class="filter-chip" type="button" data-filter="photo" aria-pressed="false">Photo</button>
        <button class="filter-chip" type="button" data-filter="movie" aria-pressed="false">Movie</button>
      </div>

      <div class="work-grid" id="workGrid" aria-live="polite"></div>

      <p class="empty-state" id="emptyState" hidden>No work has been added to this category yet.</p>
    </section>

    <section class="about" id="about" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <div class="about-body">
        <p>Shoma Kondo</p>
        <p>映像制作、リアルタイム表現、ソフトウェア／DSP開発、制作支援ツールの設計・実装に取り組んでいます。</p>
      </div>
      <div class="about-links">
        <a href="https://github.com/ShmKnd" target="_blank" rel="noopener">GitHub ↗</a>
        <a href="https://note.com/sr_shoma" target="_blank" rel="noopener">Notes ↗</a>
        <a href="https://plugin.soundrave.org/" target="_blank" rel="noopener">SoundRave ↗</a>
        <a href="mailto:s.knife0317@gmail.com">Email ↗</a>
      </div>
    </section>

    <footer>
      <p>© 2026 Shoma Kondo</p>
      <a href="#home">Back to top ↑</a>
    </footer>
  </main>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <aside class="side-sheet" id="sideSheet" aria-hidden="true">
    <nav class="sheet-nav">
      <button class="sheet-back" id="sheetBack" aria-label="Close">
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
    </nav>
    <div class="sheet-body">
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <div class="sheet-images" id="sheetImages"></div>
      <div class="sheet-summary" id="sheetSummary"></div>
      <div class="sheet-notes" id="sheetNotes"></div>
      <div class="sheet-background" id="sheetBackground"></div>
      <div class="sheet-links" id="sheetLinks"></div>
    </div>
  </aside>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-bg" id="lightboxBg"></div>
    <img class="lightbox-img" id="lightboxImg" alt="" />
  </div>

  <script src="assets/js/projects-data.js"></script>
  <script src="assets/js/projects.js"></script>
  <script>
    window.PORTFOLIO_READY.finally(function () {
      var script = document.createElement('script');
      script.src = 'assets/js/ui.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
